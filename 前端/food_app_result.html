<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美食APP - 食谱生成结果页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .title-section {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            padding: 20px;
            position: relative;
        }
        .back-button {
            position: absolute;
            left: 16px;
            width: 40px;
            height: 40px;
            background-color: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .back-button::after {
            content: '';
            width: 16px;
            height: 12px;
            background-color: #000000;
            clip-path: polygon(100% 40%, 40% 40%, 40% 0%, 0% 50%, 40% 100%, 40% 60%, 100% 60%);
        }
        .back-button:hover {
            opacity: 0.8;
        }
        .title-section h1 {
            color: #000000;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
        .recipe-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 20px;
        }
        .recipe-card-link {
            text-decoration: none;
            display: block;
        }
        .recipe-card {
            width: 100%;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .recipe-card .image-area {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f8b195 0%, #f67280 50%, #c06c84 100%);
            border-radius: 16px 16px 0 0;
            position: relative;
        }
        .recipe-card .category-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
        }
        .recipe-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 100%);
            border-radius: 0 0 16px 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 16px;
        }
        .recipe-card .recipe-name {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .recipe-card .recipe-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .recipe-card .time-info {
            color: #ffffff;
            font-size: 14px;
        }
        .recipe-card .rating-info {
            color: #ffffff;
            font-size: 14px;
        }
        .recipe-card .flavor-tag {
            color: #ffffff;
            font-size: 12px;
            background-color: rgba(255,255,255,0.3);
            padding: 4px 8px;
            border-radius: 4px;
            align-self: flex-start;
        }
        .ai-panel {
            width: 100%;
            padding: 20px;
            background-color: #fff7e7;
            border-bottom: 1px solid #f0e3d6;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }
        .ai-panel textarea {
            width: 100%;
            min-height: 100px;
            max-height: 150px;
            border: 1px solid #e0c9a5;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            overflow-y: auto;
        }
        .ai-panel .ai-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .ai-panel button {
            border: none;
            background-color: #f2c94c;
            color: #000000;
            border-radius: 999px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .ai-panel button:hover {
            opacity: 0.9;
        }
        .ai-panel .ai-result {
            width: 100%;
            min-height: 140px;
            max-height: 200px;
            border: 1px solid #e0c9a5;
            border-radius: 16px;
            padding: 16px;
            background-color: #ffffff;
            color: #333333;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            overflow-y: auto;
        }
        .food-recognition-panel {
            width: 100%;
            padding: 20px;
            background-color: #e8f5e8;
            border-bottom: 1px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }
        .food-recognition-panel h3 {
            color: #2e7d32;
            font-size: 18px;
            font-weight: bold;
        }
        .food-recognition-panel .recognition-result {
            width: 100%;
            min-height: 120px;
            max-height: 180px;
            border: 1px solid #c8e6c9;
            border-radius: 16px;
            padding: 16px;
            background-color: #ffffff;
            color: #333333;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            overflow-y: auto;
        }
    </style>
    <link rel="stylesheet" href="touch.css">
</head>
<body>
    <div class="title-section">
        <a href="#" class="back-button" id="backButton"></a>
        <h1>您的专属食谱已生成</h1>
    </div>
    
    <!-- 食材识别结果面板 -->
    <div class="food-recognition-panel" id="foodRecognitionPanel" style="display: none;">
        <h3>食材识别结果</h3>
        <div class="recognition-result" id="recognitionResult">识别结果将显示在这里。</div>
    </div>
    
    <div class="ai-panel">
        <div>请输入您的饮食目标或偏好，例如“我想减脂，晚餐想吃低卡中餐”。</div>
        <textarea id="aiQuery" placeholder="例如：我今天想吃低脂、低盐的晚餐，需控制热量在500卡以内。"></textarea>
        <div class="ai-actions">
            <button id="generateButton">生成个性化食谱</button>
            <div id="aiStatus">后端未请求</div>
        </div>
        <div class="ai-result" id="aiResult">AI回复会显示在这里。</div>
    </div>
    
    <div class="recipe-list">
        <a href="food_app_detail.html" class="recipe-card-link">
            <div class="recipe-card">
                <div class="image-area">
                    <div class="category-tag" style="background-color: #f2c94c;">中式</div>
                    <div class="overlay">
                        <div class="recipe-name">红烧肉</div>
                        <div class="recipe-info">
                            <div class="time-info">制作时长：45分钟</div>
                            <div class="rating-info">推荐指数：★★★★★</div>
                        </div>
                        <div class="flavor-tag">口味：香甜</div>
                    </div>
                </div>
            </div>
        </a>
        
        <a href="food_app_detail_italian.html" class="recipe-card-link">
            <div class="recipe-card">
                <div class="image-area" style="background: url('picture/italian Pasta.png') center/cover no-repeat;">
                    <div class="category-tag" style="background-color: #ff6b6b;">西式</div>
                    <div class="overlay">
                        <div class="recipe-name">意大利面</div>
                        <div class="recipe-info">
                            <div class="time-info">制作时长：30分钟</div>
                            <div class="rating-info">推荐指数：★★★★★★</div>
                        </div>
                        <div class="flavor-tag">口味：浓郁</div>
                    </div>
                </div>
            </div>
        </a>

        <a href="food_app_detail_sushi.html" class="recipe-card-link">
            <div class="recipe-card">
                <div class="image-area" style="background: url('picture/Fish Curry.png') center/cover no-repeat;">
                    <div class="category-tag" style="background-color: #4ecdc4;">日式</div>
                    <div class="overlay">
                        <div class="recipe-name">寿司拼盘</div>
                        <div class="recipe-info">
                            <div class="time-info">制作时长：25分钟</div>
                            <div class="rating-info">推荐指数：★★★★★★</div>
                        </div>
                        <div class="flavor-tag">口味：鲜美</div>
                    </div>
                </div>
            </div>
        </a>

        <a href="food_app_detail_korean.html" class="recipe-card-link">
            <div class="recipe-card">
                <div class="image-area" style="background: url('picture/Beef Steak.png') center/cover no-repeat;">
                    <div class="category-tag" style="background-color: #a8e6cf;">韩式</div>
                    <div class="overlay">
                        <div class="recipe-name">韩式烤肉</div>
                        <div class="recipe-info">
                            <div class="time-info">制作时长：35分钟</div>
                            <div class="rating-info">推荐指数：★★★★</div>
                        </div>
                        <div class="flavor-tag">口味：香辣</div>
                    </div>
                </div>
            </div>
        </a>

        <a href="food_app_detail_dessert.html" class="recipe-card-link">
            <div class="recipe-card">
                <div class="image-area" style="background: url('picture/Chicken Salad.png') center/cover no-repeat;">
                    <div class="category-tag" style="background-color: #f2c94c;">甜点</div>
                    <div class="overlay">
                        <div class="recipe-name">法式甜点</div>
                        <div class="recipe-info">
                            <div class="time-info">制作时长：40分钟</div>
                            <div class="rating-info">推荐指数：★★★★★★</div>
                        </div>
                        <div class="flavor-tag">口味：甜美</div>
                    </div>
                </div>
            </div>
        </a>
    </div>
    <script src="common.js"></script>
    <script src="navigation.js"></script>
    <script>
        const generateButton = document.getElementById('generateButton');
        const aiQuery = document.getElementById('aiQuery');
        const aiResult = document.getElementById('aiResult');
        const aiStatus = document.getElementById('aiStatus');
        const backButton = document.getElementById('backButton');
        const foodRecognitionPanel = document.getElementById('foodRecognitionPanel');
        const recognitionResult = document.getElementById('recognitionResult');

        // 显示食材识别结果
        function displayFoodRecognitionResult() {
            const recognitionData = localStorage.getItem('foodRecognitionResult');
            if (recognitionData) {
                try {
                    const data = JSON.parse(recognitionData);
                    if (data.ingredients) {
                        const ingredientsList = data.ingredients.join('、');
                        recognitionResult.textContent = `识别到的食材：${ingredientsList}`;
                        foodRecognitionPanel.style.display = 'flex';
                    }
                } catch (error) {
                    console.error('解析识别结果失败:', error);
                }
            }
        }

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || '';
        }

        // 存储生成的菜谱数据
        let recipeCounter = parseInt(localStorage.getItem('recipeCounter') || '0');

        // 创建菜谱卡片DOM元素
        function createRecipeCard(recipe, index) {
            const link = document.createElement('a');
            link.href = 'food_app_recipe_view.html?id=' + index;
            link.className = 'recipe-card-link';
            link.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = link.getAttribute('href');
            });

            const categoryColors = {
                '中式': '#f2c94c', '西式': '#ff6b6b', '日式': '#4ecdc4',
                '韩式': '#a8e6cf', '甜点': '#f2c94c'
            };
            const bgColor = categoryColors[recipe.category] || '#f2c94c';
            const categoryStyle = {
                '中式': { emoji: '🥟', gradient: 'linear-gradient(135deg, #f8b195 0%, #f67280 50%, #c06c84 100%)' },
                '西式': { emoji: '🍝', gradient: 'linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3a5 100%)' },
                '日式': { emoji: '🍣', gradient: 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)' },
                '韩式': { emoji: '🥘', gradient: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)' },
                '甜点': { emoji: '🍰', gradient: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)' }
            };
            const style = categoryStyle[recipe.category] || { emoji: '🍽️', gradient: 'linear-gradient(135deg, #e0e0e0 0%, #c0c0c0 100%)' };

            link.innerHTML = `
                <div class="recipe-card">
                    <div class="image-area" style="background: ${style.gradient}; display: flex; align-items: center; justify-content: center;">
                        <div class="card-emoji" style="font-size: 72px; opacity: 0.5;">${style.emoji}</div>
                        <div class="category-tag" style="background-color: ${bgColor}; position: absolute; top: 12px; left: 12px;">${recipe.category || '推荐'}</div>
                        <div class="overlay">
                            <div class="recipe-name">${recipe.name}</div>
                            <div class="recipe-info">
                                <div class="time-info">制作时长：${recipe.cook_time || '未知'}</div>
                                <div class="rating-info">推荐指数：${recipe.rating || '★★★★'}</div>
                            </div>
                            <div class="flavor-tag">口味：${recipe.flavor || '美味'}</div>
                        </div>
                    </div>
                </div>
            `;

            // 异步加载真实图片（5秒超时）
            const keyword = encodeURIComponent(recipe.name || '');
            const imageArea = link.querySelector('.image-area');
            const controller = new AbortController();
            var timeoutId = setTimeout(function() { controller.abort(); }, 5000);
            fetch(backendUrl + '/api/search-image?q=' + keyword, { signal: controller.signal })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    clearTimeout(timeoutId);
                    if (data.image_url) {
                        var img = new Image();
                        img.onload = function() {
                            imageArea.style.backgroundImage = "url('" + data.image_url + "')";
                            imageArea.style.backgroundSize = 'cover';
                            imageArea.style.backgroundPosition = 'center';
                            var emoji = imageArea.querySelector('.card-emoji');
                            if (emoji) emoji.style.display = 'none';
                        };
                        img.src = data.image_url;
                    }
                })
                .catch(function() { clearTimeout(timeoutId); });

            return link;
        }

        async function generateRecipe() {
            const prompt = aiQuery.value.trim();
            if (!prompt) {
                alert('请输入您的饮食偏好或目标。');
                return;
            }

            aiStatus.textContent = '生成中...';
            aiResult.textContent = '正在请求后端AI接口，请稍候。';

            // 获取识别到的食材
            let ingredients = [];
            try {
                const recognitionData = localStorage.getItem('foodRecognitionResult');
                if (recognitionData) {
                    const data = JSON.parse(recognitionData);
                    ingredients = data.ingredients || [];
                }
            } catch (e) {
                console.error('读取食材识别结果失败:', e);
            }

            try {
                // 一次调用：同时获得简短推荐 + 结构化菜谱
                const resp = await fetch(backendUrl + '/api/generate-recipe-structured', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ingredients: ingredients, preference: prompt })
                });

                const data = await resp.json();
                if (resp.ok && data.recipe) {
                    // 显示简短推荐文字
                    if (data.summary) {
                        aiResult.textContent = data.summary;
                    }
                    aiStatus.textContent = '生成成功';
                    // 保存对话记录到localStorage
                    localStorage.setItem('lastAiPrompt', prompt);
                    localStorage.setItem('lastAiResponse', data.summary || '');

                    // 创建菜谱卡片
                    const recipe = data.recipe;
                    recipeCounter++;
                    localStorage.setItem('recipeCounter', String(recipeCounter));
                    localStorage.setItem('generatedRecipe_' + recipeCounter, JSON.stringify(recipe));

                    const card = createRecipeCard(recipe, recipeCounter);
                    const recipeList = document.querySelector('.recipe-list');
                    recipeList.insertBefore(card, recipeList.firstChild);

                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    aiResult.textContent = data.detail || data.error || '生成失败，请重试。';
                    aiStatus.textContent = '请求失败';
                }
            } catch (error) {
                aiResult.textContent = '网络错误：' + error.message;
                aiStatus.textContent = '网络异常';
            }
        }

        // 页面加载时自动填入搜索词（来自首页搜索框），但不自动生成
        function autoFillSearchQuery() {
            const initialQuery = getQueryParam('query');
            if (initialQuery) {
                aiQuery.value = initialQuery;
            }
        }

        // 页面加载时从 localStorage 恢复之前生成的菜谱卡片
        function loadGeneratedRecipeCards() {
            const counter = parseInt(localStorage.getItem('recipeCounter') || '0');
            const recipeList = document.querySelector('.recipe-list');
            let count = 0;
            for (let i = counter; i >= 1; i--) {
                const stored = localStorage.getItem('generatedRecipe_' + i);
                if (stored) {
                    try {
                        const recipe = JSON.parse(stored);
                        const card = createRecipeCard(recipe, i);
                        recipeList.insertBefore(card, recipeList.firstChild);
                        count++;
                    } catch (e) {
                        console.error('加载已保存的菜谱卡片失败:', e);
                    }
                }
            }
            if (count > 0) {
                console.log('已恢复 ' + count + ' 个菜谱卡片');
            }
        }

        generateButton.addEventListener('click', generateRecipe);
        backButton.addEventListener('click', function(e) {
            e.preventDefault();
            history.back();
        });
        
        // 为食谱卡片链接添加导航栈处理
        const recipeLinks = document.querySelectorAll('.recipe-card-link');
        recipeLinks.forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = link.getAttribute('href');
                window.location.href = targetUrl;
            });
        });
        
        // 页面加载时恢复上一次的AI对话记录
        function restoreChatHistory() {
            const savedPrompt = localStorage.getItem('lastAiPrompt');
            const savedResponse = localStorage.getItem('lastAiResponse');
            if (savedPrompt) {
                aiQuery.value = savedPrompt;
            }
            if (savedResponse) {
                aiResult.textContent = savedResponse;
                aiStatus.textContent = '生成成功';
            }
        }

        // 页面加载时显示食材识别结果
        displayFoodRecognitionResult();
        // 恢复上一次的AI对话
        restoreChatHistory();
        // 恢复之前生成的菜谱卡片
        loadGeneratedRecipeCards();
        autoFillSearchQuery();
    </script>
    <script src="touch.js"></script>
</body>
</html>
